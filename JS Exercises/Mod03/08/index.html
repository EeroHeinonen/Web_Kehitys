<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Add all the given names into an array</h1>
    <div>  
        <form>
            <label for="userIn" style="font-size: 25px;">Input the names separated with a comma:</label>
            <div style="padding-top: 15px; padding-bottom: 15px;">
                <input type="text" id="userIn" style="min-width: 200px; height: 30px; font-size: 25px; field-sizing: content;">
                <input type="submit" style="width: 100px; height: 35px; font-size: 25px;" id="submit">
            </div>
        </form>

        <h2 id="arrayTitle" hidden>Names in the array</h2>
        <ul style="font-size: 25px; "id="names"></ul>
        <p style="font-size: 25px; "id="string"></p>
        <p style="font-size: 25px; "id="array"></p>

    </div>
    <script src="8.js" defer></script>
</body>
</html>
