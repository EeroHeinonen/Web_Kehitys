<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form style="font-size: 30px;" action="{{ url_for("addWord")}}" method="post">
        <div style="padding-bottom: 20px;">
            <label for="dictItem">Word:</label>
            <input style="font-size: 25px;" type="text" id="dictItem" name="dictItem" placeholder="Word:Translation">
            <button style="font-size: 25px;" type="submit">Add word</button>
            <p>{{added}}</p>
        </div>
    </form>
    <form style="font-size: 30px;" action="{{ url_for("deleteWord")}}" method="post">
        <label for="dictDelete">Word:</label>
        <input style="font-size: 25px;" type="text" id="dictDelete" name="dictDelete" placeholder="Word">
        <button style="font-size: 25px;" type="submit" name="delete">Delete word</button>
    </form>

    <form style="font-size: 30px;" action="{{ url_for("translate")}}" method="post">
        <div>
            <label for="word">Word:</label>
            <input style="font-size: 25px;" type="text" id="word" name="word">
            <button style="font-size: 25px;" type="submit">Translate</button>
            <p>{{result}}</p>
        </div>
    </form>
</body>
</html>
